# ViPadLink button mapping
# Buttons not listed pass through unchanged (default behaviour)
#
# Valid button names:
#   A  B  X  Y
#   LB  RB
#   LT  RT  (triggers — not remappable, analog only)
#   LS  RS  (left/right stick click)
#   Start  Back
#   Up  Down  Left  Right
#
# Example — swap A and B for Pad 1 (Nintendo layout):
# [Pad1]
# A = B
# B = A
#
# Example — swap X and Y for Pad 2:
# [Pad2]
# X = Y
# Y = X

[Pad1]

[Pad2]
